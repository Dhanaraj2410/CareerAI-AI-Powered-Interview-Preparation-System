{% extends 'base.html' %}

{% block title %}User Profile - CareerAI{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="glass-card p-4 p-md-5">
            <h3 class="font-heading mb-3"><i class="fa-solid fa-user-gear text-indigo me-2"></i> User Profile Settings</h3>
            
            <form method="post">
                {% csrf_token %}
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label text-muted small fw-bold">TARGET JOB ROLE</label>
                        {{ form.target_role }}
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-muted small fw-bold">EXPERIENCE LEVEL</label>
                        {{ form.experience_level }}
                    </div>
                    <div class="col-md-12">
                        <label class="form-label text-muted small fw-bold">PHONE NUMBER</label>
                        {{ form.phone }}
                    </div>
                    <div class="col-md-12">
                        <label class="form-label text-muted small fw-bold">PROFESSIONAL BIO & CAREER OBJECTIVE</label>
                        {{ form.bio }}
                    </div>
                </div>

                <div class="mt-4 pt-3 text-end border-top border-secondary">
                    <a href="{% url 'dashboard' %}" class="btn btn-outline-glass me-2">Cancel</a>
                    <button type="submit" class="btn btn-primary-glow px-4">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
