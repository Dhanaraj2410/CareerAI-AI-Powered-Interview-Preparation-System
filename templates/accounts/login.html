{% extends 'base.html' %}

{% block title %}Login - CareerAI{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-5">
        <div class="glass-card p-4 p-md-5">
            <h2 class="text-center mb-1 font-heading">Welcome Back</h2>
            <p class="text-center text-muted mb-4">Sign in to your CareerAI Dashboard</p>

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label text-muted small fw-bold">USERNAME</label>
                    <input type="text" name="username" class="form-control" placeholder="Enter username" required>
                </div>
                <div class="mb-4">
                    <label class="form-label text-muted small fw-bold">PASSWORD</label>
                    <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                </div>

                <button type="submit" class="btn btn-primary-glow w-100 py-3 font-weight-bold">Sign In</button>
            </form>

            <div class="text-center mt-4 pt-3 border-top border-secondary">
                <span class="text-muted">Don't have an account?</span>
                <a href="{% url 'register' %}" class="text-indigo ms-1 fw-bold text-decoration-none">Register Now</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
